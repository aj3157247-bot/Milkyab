<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جزئیات ملک</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="../index.html">🏠 رهنمای معاملات</a><nav><a href="properties.html">املاک</a><a href="add-property.html">ثبت ملک</a><a href="office.html">دفتر ما</a><a href="dashboard.html">حساب من</a></nav></div></header><main class="page"><div class="container" id="detail"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>
async function load(){const id=new URLSearchParams(location.search).get("id");let p=demoProperties.find(x=>x.id===id);if(sb&&!p){const r=await sb.from("properties").select("*").eq("id",id).single();p=r.data}if(!p){detail.innerHTML='<div class="empty">ملک پیدا نشد.</div>';return}detail.innerHTML=`<div class="two-col"><div><img class="detail-img" src="${esc(p.image_url||"https://images.unsplash.com/photo-1560185008-b033106af5c3?auto=format&fit=crop&w=1200&q=80")}"><div class="panel" style="margin-top:18px"><span class="badge">${p.deal_type==="rent"?"کرایی":"فروشی"}</span><h1>${esc(p.title)}</h1><div class="price">${money(p.price)} ${p.unit==="ماهانه"?"افغانی / ماه":"افغانی"}</div><p>${esc(p.description||"توضیحی ثبت نشده است.")}</p><div class="meta">📍 ${esc(p.province)}، ${esc(p.district)} · 📐 ${esc(p.area||"-")} متر · 🛏️ ${esc(p.rooms||"-")} اتاق</div></div></div><aside class="panel"><h2>درخواست بازدید</h2><p>برای هماهنگی بازدید با دفتر معاملات تماس بگیرید یا درخواست خود را ثبت کنید.</p><form class="form" onsubmit="requestVisit(event,'${esc(p.id)}')"><input id="name" required placeholder="نام"><input id="phone" required placeholder="شماره تماس"><input id="date" type="datetime-local" required><textarea id="note" placeholder="توضیحات"></textarea><button class="btn btn-primary">درخواست بازدید</button></form><hr><h3>دفتر رهنمای معاملات</h3><p>📍 کابل، آدرس دفتر شما</p><p>☎️ شماره تماس دفتر</p><a class="btn btn-light" href="tel:+93700000000">تماس با دفتر</a></aside></div>`}
async function requestVisit(e,id){e.preventDefault();if(!requireConfig()){return}const u=await currentUser();if(!u){location.href="login.html?next="+encodeURIComponent(location.href);return}const {error}=await sb.from("viewing_requests").insert({property_id:id,user_id:u.id,requested_at:date.value,customer_name:name.value,customer_phone:phone.value,note:note.value,status:"pending"});alert(error?error.message:"درخواست بازدید ثبت شد. دفتر با شما تماس می‌گیرد.");if(!error)e.target.reset()}
load();
</script></body></html>
