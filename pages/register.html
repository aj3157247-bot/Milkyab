<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت‌نام</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="page"><div class="container" style="max-width:560px"><div class="panel"><h1>ایجاد حساب</h1><div id="msg"></div><form class="form" onsubmit="registerUser(event)"><input id="full_name" required placeholder="نام و نام خانوادگی"><input id="phone" required placeholder="شماره تماس"><input id="email" type="email" required placeholder="ایمیل"><input id="password" type="password" minlength="6" required placeholder="رمز عبور"><select id="role"><option value="customer">مشتری</option><option value="owner">مالک</option><option value="office">دفتر معاملات</option></select><button class="btn btn-primary">ثبت‌نام</button></form><p><a href="login.html" style="color:var(--primary)">قبلاً حساب دارید؟ ورود</a></p></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>async function registerUser(e){e.preventDefault();if(!requireConfig())return;const {data,error}=await sb.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:full_name.value,phone:phone.value,role:role.value}}});if(error){msg.className="notice error";msg.textContent=error.message;return}msg.className="notice success";msg.textContent=data.session?"حساب ساخته شد.":"حساب ساخته شد؛ ایمیل خود را برای تأیید بررسی کنید."}</script></body></html>
