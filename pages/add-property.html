<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت ملک</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="../index.html">🏠 رهنمای معاملات</a><a class="btn btn-light" href="dashboard.html">داشبورد</a></div></header><main class="page"><div class="container" style="max-width:850px"><div class="panel"><h1>ثبت ملک جدید</h1><div id="msg"></div><form class="form" onsubmit="saveProperty(event)"><div class="form-grid"><div><label>عنوان</label><input id="title" required placeholder="مثلاً خانه ۳ اتاقه در کارته چهار"></div><div><label>نوع معامله</label><select id="deal_type"><option value="rent">کرایی</option><option value="sale">فروشی</option></select></div><div><label>ولایت</label><input id="province" value="کابل" required></div><div><label>منطقه / ناحیه</label><input id="district" required></div><div><label>نوع ملک</label><select id="category"><option>خانه</option><option>آپارتمان</option><option>دکان</option><option>زمین</option><option>باغ</option></select></div><div><label>قیمت</label><input id="price" type="number" required></div><div><label>مساحت (متر)</label><input id="area" type="number"></div><div><label>تعداد اتاق</label><input id="rooms" type="number"></div><div><label>واحد قیمت</label><select id="unit"><option value="ماهانه">ماهانه</option><option value="افغانی">افغانی</option></select></div><div><label>لینک عکس اصلی</label><input id="image_url" placeholder="https://..."></div></div><div><label>توضیحات</label><textarea id="description" required></textarea></div><button class="btn btn-primary">ثبت ملک برای بررسی</button></form></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>async function saveProperty(e){e.preventDefault();if(!requireConfig())return;const u=await currentUser();if(!u){location.href="login.html?next=add-property.html";return}const {error}=await sb.from("properties").insert({owner_id:u.id,title:title.value,province:province.value,district:district.value,category:category.value,deal_type:deal_type.value,price:Number(price.value),unit:unit.value,area:Number(area.value)||null,rooms:Number(rooms.value)||null,image_url:image_url.value||null,description:description.value,status:"pending"});if(error){msg.className="notice error";msg.textContent=error.message}else{msg.className="notice success";msg.textContent="ملک ثبت شد و برای بررسی دفتر ارسال گردید.";e.target.reset()}}</script></body></html>
