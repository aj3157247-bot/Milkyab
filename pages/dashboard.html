<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>داشبورد</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="../index.html">🏠 رهنمای معاملات</a><button class="btn btn-light" onclick="signOut()">خروج</button></div></header><main class="page"><div class="container"><h1>داشبورد من</h1><div class="stats"><div class="stat"><strong id="pcount">0</strong>ملک‌های من</div><div class="stat"><strong id="vcount">0</strong>درخواست بازدید</div><div class="stat"><strong>—</strong>معاملات</div><div class="stat"><strong>—</strong>کمیسیون</div></div><div class="panel" style="margin-top:20px"><a class="btn btn-primary" href="add-property.html">+ ثبت ملک جدید</a><div id="mine" class="property-grid" style="margin-top:20px"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>async function load(){if(!requireConfig())return;const u=await currentUser();if(!u){location.href="login.html";return}const r=await sb.from("properties").select("*").eq("owner_id",u.id).order("created_at",{ascending:false});pcount.textContent=(r.data||[]).length;mine.innerHTML=(r.data||[]).map(card).join("")||'<div class="empty">هنوز ملکی ثبت نکرده‌اید.</div>';const v=await sb.from("viewing_requests").select("id",{count:"exact",head:true}).eq("user_id",u.id);vcount.textContent=v.count||0}load();</script></body></html>
