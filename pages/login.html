<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود</title><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="page"><div class="container" style="max-width:500px"><div class="panel"><h1>ورود به حساب</h1><div id="msg"></div><form class="form" onsubmit="login(event)"><input id="email" type="email" required placeholder="ایمیل"><input id="password" type="password" required placeholder="رمز عبور"><button class="btn btn-primary">ورود</button></form><p>حساب ندارید؟ <a href="register.html" style="color:var(--primary)">ثبت‌نام</a></p></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>async function login(e){e.preventDefault();if(!requireConfig())return;const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.className="notice error";msg.textContent=error.message;return}location.href=new URLSearchParams(location.search).get("next")||"dashboard.html"}</script></body></html>
